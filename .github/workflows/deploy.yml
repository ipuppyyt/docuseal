name: Build & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: docuseal
  DEPLOY_DIR: /root/docuseal

jobs:
  deploy:
    name: Build image and deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port ${{ secrets.VPS_PORT || 22 }}
            PreferredAuthentications password
            PubkeyAuthentication no
          CFG

      - name: Copy compose and Caddy config
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh vps "mkdir -p ${{ env.DEPLOY_DIR }}"
          sshpass -e scp compose.yml Caddyfile vps:${{ env.DEPLOY_DIR }}/

      - name: Stream image to server
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          docker save ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} | gzip | sshpass -e ssh vps 'gunzip | docker load'

      - name: Restart and wait for healthy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh vps bash -s <<'REMOTE'
          set -e
          cd ${{ env.DEPLOY_DIR }}
          TAG=sha-${{ github.sha }}
          touch .env
          docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
          mkdir -p /root/caddy/conf.d
          grep -q '^IMAGE_TAG=' .env && sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env || echo "IMAGE_TAG=$TAG" >> .env
          docker compose up -d --remove-orphans
          for i in $(seq 1 30); do
            s=$(docker compose ps -q app | xargs docker inspect -f '{{.State.Health.Status}}' 2>/dev/null || echo starting)
            if [ "$s" = "healthy" ]; then
              echo healthy
              # keep the 3 newest images for rollback, drop the rest
              docker images docuseal --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' | sort -r | tail -n +4 | cut -d'|' -f2 | xargs -r docker rmi || true
              exit 0
            fi
            sleep 5
          done
          docker compose logs --tail=100 app
          echo "app did not become healthy"; exit 1
          REMOTE
